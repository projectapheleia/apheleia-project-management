# Tasks shared by several people.
#
# resource is one name, or a list of names for a task shared by several people. The estimate, spent and
# remaining are for the task as a whole: the effort of everyone on it, not of each person. A shared task
# is shown, in full, on the Tasks tab of the page of each of its resources, and the resource column links
# to each of them.
type: "tasks_definitions"
