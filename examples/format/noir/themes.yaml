# Film noir themes. These are the only two offered, since the format turns the built-in themes off.
# Anything a theme does not give is taken from the built-in default theme, which is always available
# as the base even though it is not offered.
type: "themes_definitions"
data:
  # Newsprint and shadow: parchment and black with blood red as the only colour
  - name: "noir-light"
    label: "Noir Light"
    variables:
      radius: "2px"
      band-dark: "#141414"
      band-mid: "#222222"
      band-light: "#383838"
      on-dark: "#f1e9d6"
      accent: "#8b1a1a"
      accent-dark: "#5e0f0f"
      accent-2: "#a8a08c"
      on-accent: "#f6efe0"
      page: "#e4dac4"
      card: "#f6efe0"
      ink: "#1a1a1a"
      muted: "#5c5546"
      title: "#111111"
      link: "#5e0f0f"
      line: "#c9bd9f"
      shadow: "rgba(30, 20, 0, 0.18)"
      zebra: "#efe6d2"
      hover: "#e3d7bb"
      head-a: "#f8f2e4"
      head-b: "#ebe1ca"
      row-odd: "#f6efe0"
      row-line: "#ddd2b8"
      filter-bg: "#e8dec6"
      input-bg: "#fbf7ec"
      input-border: "#a89f86"
      tab-bar: "#d9cdb2"
      tab-hover: "rgba(255, 255, 255, 0.45)"
      current: "#e9d9a0"
      bad: "#8b1a1a"
      over: "#e8c9c2"
      # Slats of light through venetian blinds
      header-bg: "repeating-linear-gradient(168deg, #141414 0 16px, #2b2b2b 16px 30px)"
      header-shadow: "0 3px 10px rgba(0, 0, 0, 0.5)"
      kicker-text: "#c9bd9f"
      meta-text: "#b3a98f"
      toolbar-text: "#d8cfb8"
      logo-bg: "#e9dfc9"
      logo-ink: "#141414"
      logo-ember: "#d4551a"
      tooltip-bg: "rgba(20, 20, 20, 0.96)"
      tooltip-text: "#f1e9d6"
      font: 'Georgia, "Times New Roman", serif'
      title-font: '"Didot", "Bodoni MT", "Playfair Display", Georgia, serif'
    chart:
      paper: "#f6efe0"
      plot: "#ede4d0"
      font: "#1a1a1a"
      font_family: "Georgia, Times New Roman, serif"
      grid_x: "#d6cbb2"
      grid_y: "#ddd2b8"
      line: "#8a8068"
      legend_bg: "rgba(246, 239, 224, 0.9)"
      legend_border: "#8a8068"
    # Bars in shades of sepia grey, as if from a black and white film
    bars:
      ramp:
        hue: 35
        saturation: 8
        lightness: [14, 62]
    css: |
      @theme .logo-link { border: 1px solid #8a8068; border-radius: 2px; }
      @theme .card { border-width: 2px; }

  # The same scene with the lights off: charcoal and cream, red kept for emphasis
  - name: "noir-dark"
    label: "Noir Dark"
    dark: true
    extends: "noir-light"
    variables:
      band-dark: "#000000"
      band-mid: "#121212"
      band-light: "#262626"
      on-dark: "#ece6d3"
      accent: "#b32424"
      accent-dark: "#7d1717"
      accent-2: "#d9c9a0"
      on-accent: "#f6efe0"
      page: "#0c0c0c"
      card: "#161616"
      ink: "#e8e2d0"
      muted: "#9a927e"
      title: "#f1ead6"
      link: "#d9c9a0"
      line: "#2e2e2e"
      shadow: "rgba(0, 0, 0, 0.6)"
      zebra: "#1b1b1b"
      hover: "#2a2a2a"
      head-a: "#202020"
      head-b: "#181818"
      row-odd: "#161616"
      row-line: "#252525"
      filter-bg: "#1d1d1d"
      input-bg: "#0c0c0c"
      input-border: "#4a4a4a"
      tab-bar: "#101010"
      tab-hover: "rgba(255, 255, 255, 0.06)"
      current: "#3a3320"
      bad: "#d94040"
      over: "#3a1818"
      header-bg: "repeating-linear-gradient(168deg, #030303 0 16px, #131313 16px 30px)"
      header-shadow: "0 3px 14px rgba(0, 0, 0, 0.8)"
      kicker-text: "#a39a84"
      meta-text: "#8c846f"
      toolbar-text: "#cfc7b0"
      logo-bg: "#1c1c1c"
      logo-ink: "#e8e2d0"
      tooltip-bg: "rgba(0, 0, 0, 0.96)"
      tooltip-text: "#ece6d3"
    chart:
      paper: "#161616"
      plot: "#1b1b1b"
      font: "#e8e2d0"
      grid_x: "#2c2c2c"
      grid_y: "#262626"
      line: "#4a4a4a"
      legend_bg: "rgba(22, 22, 22, 0.9)"
      legend_border: "#4a4a4a"
    bars:
      ramp:
        hue: 40
        saturation: 10
        lightness: [40, 86]
    css: |
      @theme .logo-link { border: 1px solid #4a4a4a; border-radius: 2px; }
      @theme .card { border-width: 2px; }
