type: "resources_definitions"
data:
  # Available full time apart from two weeks' leave, then half time
  - resource: "Mickey Mouse"
    uname: "mmouse"
    periods:
      - start: "2024-01-01"
        end: "2025-07-31"
      - start: "2025-08-01"
        end: "2025-08-14"
        availability: 0
      - start: "2025-08-15"
        end: "2026-06-01"
        availability: 50
    profile: ""

  # A single period can be given with start and end, without periods
  - resource: "Daffy Duck"
    uname: "dduck"
    start: "2026-05-01"
    end: None
    profile: "https://en.wikipedia.org/wiki/Daffy_Duck"

  # Full time, with a month's leave left as a gap between periods, then open ended at 80%
  - resource: "He Man"
    uname: "hman"
    periods:
      - start: "2021-01-01"
        end: "2026-11-30"
      - start: "2027-01-01"
        availability: 80
