[project]
name = "apheleia-project-management"
version = "1.0.0"
description = "Plan projects in YAML and generate interactive HTML reports of timelines, resource allocation and task progress"
authors = [{name = "avl", email = "avl@projectapheleia.net"}]
maintainers = [{name = "avl", email = "avl@projectapheleia.net"}]
keywords = ["project management", "planning", "gantt", "resource allocation", "yaml", "report"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.3",
    "pyyaml>=6.0",
    "plotly>=6.6.0,<8",
]

[project.urls]
Homepage = "https://github.com/projectapheleia/apheleia-project-management"
Documentation = "https://apheleia-project-management.readthedocs.io"
Source = "https://github.com/projectapheleia/apheleia-project-management"
Issues = "https://github.com/projectapheleia/apheleia-project-management/issues"
Changelog = "https://github.com/projectapheleia/apheleia-project-management/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "sphinx>=8.1.3",
    "sphinx_rtd_theme>=3.0.2",
    "ruff>=0.11.0"
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "apheleia_project_management" }]

[tool.ruff]
target-version = "py310"

src = ["apheleia_project_management"]

exclude = ["doc", "build", "dist", "venv"]

line-length = 200

fix = false

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]

[tool.ruff.lint.per-file-ignores]
# Html templates and help text
"apheleia_project_management/_html.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[project.scripts]
apheleia_project_report = "apheleia_project_management.tools.report:main"
